DATA:
  DIM: 2 # data dimension
  BATCH_SIZE: 20 # per GPU
  DATA_PATH: "./data/P&ID_imgs/PID2Graph/Patched" # Patched P&ID root only (never the Complete sheets)
  CACHE_DIR: null # preprocessed uint8 images + graphs; null = ~/.cache/relationformer (Kaggle: /kaggle/tmp)
  DATASET: "patched-pid-2D"
  IMG_SIZE: [512, 512] # Input image size
  NUM_WORKERS: 0 # per GPU process; data comes from a uint8 memmap so 0-2 is enough (host RAM!)
  SEED: 10 # random seed for reproducibility

MODEL:
  NUM_CLASSES: 2 # Number of classes, overwritten in data preparation

  ENCODER:
    TYPE: deformable_transformer_backbone
    NAME: deformable_transformer_backbone
    HIDDEN_DIM: 256 #128 #256 #768
    POSITION_EMBEDDING: sine
    LR_BACKBONE: 3e-5
    NUM_FEATURE_LEVELS: 4
    BACKBONE: resnet101
    MASKS: False
    DILATION: False

    # parameters used else where
    IN_CHANS: 1
    DEPTHS: [4, 4, 8, 8]

  DECODER:
    TYPE: deformable_transformer
    NAME: deformable_transformer
    HIDDEN_DIM: 256 #128 #256 #768
    NHEADS: 8
    ENC_LAYERS: 4 #4 #2
    DEC_LAYERS: 4 #4 #2
    DIM_FEEDFORWARD: 512 #128 #512 #2048
    DROPOUT: 0.1 # 0.0
    ACTIVATION: relu
    NUM_FEATURE_LEVELS: 4
    DEC_N_POINTS: 4
    ENC_N_POINTS: 4
    TWO_STAGE: False
    # NUM_QUERIES: 21
    AUX_LOSS: False
    WITH_BOX_REFINE: False
    # RLN_TOKEN: True

    OBJ_TOKEN: 400
    RLN_TOKEN: 1
    DUMMY_TOKEN: 0

    RLN_ATTN: True # only do comb RLN_ATTN True + RLN_TOKEN 0 and reverse

  MATCHER:
    C_CLASS: 2
    C_NODE: 5

TRAIN:
  EPOCHS: 30
  LR: 1e-4
  LR_BACKBONE: 3e-5
  WEIGHT_DECAY: 1e-4
  LR_DROP: 20
  CLIP_MAX_NORM: 0.1
  AMP: True # fp16 autocast + GradScaler (T4 tensor cores)

  SAVE_PATH: "./trained_weights/" # save path for the checkpoint, log and val results
  VAL_INTERVAL: 1 # validation interval
  SAVE_VAL: True # save validation data
  EARLY_STOPPING_PATIENCE: 10 # stop after N validations without val_smd improvement (null = disabled)
  EARLY_STOPPING_MIN_DELTA: 0.0 # minimum val_smd decrease to count as an improvement

  # loss weight
  LOSSES: ["boxes", "class", "cards", "nodes", "edges"]
  W_BBOX: 2.0
  W_CLASS: 2.0
  W_CARD: 1.0
  W_NODE: 4.0
  W_EDGE: 3.0
  RANDOMIZE_EDGE_DIRECTIONS: True
  # edge sampling: all GT edges are positives, negatives are sampled per image
  MAX_POS_EDGES: null # null = keep every ground-truth edge (random subset otherwise)
  NEG_EDGE_RATIO: 4 # negatives sampled per positive edge
  MIN_NEG_EDGES: 20 # floor on sampled negatives for graphs with very few edges

INFERENCE:
  NODE_THRESHOLD: 0.60 # Keep only confident node predictions
  EDGE_THRESHOLD: 0.75 # Suppress low-confidence edges between predicted nodes
  NMS: False # P&ID connectors sit ~10px from symbol centres; NMS would merge them

log:
  exp_name: "pid_reduced"
  message: "Relationformer for the reduced patched P&ID line graph dataset"
